name: Test Workflow
run-name: ${{ github.actor }} is learning github actions
on: [push]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - run: echo "End of the workflow"
